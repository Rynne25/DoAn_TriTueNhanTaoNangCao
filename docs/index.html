<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>UIT-VSFC AI Feedback Analyzer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
<style>
  :root {
    --bg-deep: #070913;
    --bg-card: rgba(13, 21, 40, 0.82);
    --cyan: #06B6D4;
    --cyan-bright: #22D3EE;
    --violet: #8B5CF6;
    --violet-bright: #A855F7;
    --emerald: #10B981;
    --rose: #F43F5E;
    --amber: #F59E0B;
    --slate: #64748B;
    --text-light: #F8FAFC;
    --text-muted: #94A3B8;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    background:
      radial-gradient(circle at 12% 8%, rgba(139, 92, 246, 0.16), transparent 40%),
      radial-gradient(circle at 88% 12%, rgba(6, 182, 212, 0.15), transparent 40%),
      #070913;
    color: var(--text-light);
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    min-height: 100vh;
  }
  .container {
    max-width: 1460px;
    margin: 0 auto;
    padding: 0.75rem 1.25rem 2.2rem 1.25rem;
  }
  /* Header Row */
  .header-row {
    display: flex;
    align-items: center;
    gap: 0.65rem;
    margin-bottom: 0.65rem;
  }
  .top-title-bar {
    flex: 1;
    position: relative;
    display: flex;
    align-items: center;
    gap: 0.65rem;
    background: linear-gradient(135deg, rgba(13, 21, 40, 0.92) 0%, rgba(15, 23, 42, 0.82) 100%);
    border: 1px solid rgba(34, 211, 238, 0.35);
    border-radius: 12px;
    padding: 0.52rem 1rem;
    min-height: 44px;
    box-shadow: 0 6px 20px rgba(0, 0, 0, 0.35);
    overflow: hidden;
  }
  .top-title-bar::before {
    content: "";
    position: absolute;
    top: 0; left: 0; bottom: 0;
    width: 4px;
    background: linear-gradient(180deg, #06B6D4, #8B5CF6);
  }
  .top-title-icon {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 28px;
    height: 28px;
    border-radius: 8px;
    background: rgba(139, 92, 246, 0.22);
    border: 1px solid rgba(34, 211, 238, 0.4);
    font-size: 0.95rem;
    flex-shrink: 0;
  }
  .top-title-main {
    font-size: 1.05rem;
    font-weight: 700;
    background: linear-gradient(90deg, #F8FAFC 0%, #22D3EE 60%, #C4B5FD 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .top-title-tag {
    margin-left: auto;
    font-size: 0.72rem;
    font-weight: 700;
    font-family: 'JetBrains Mono', monospace;
    color: #22D3EE;
    background: rgba(6, 182, 212, 0.14);
    border: 1px solid rgba(34, 211, 238, 0.35);
    padding: 0.16rem 0.55rem;
    border-radius: 999px;
  }
  .lang-btn {
    width: 46px;
    height: 44px;
    border-radius: 12px;
    border: 1px solid rgba(34, 211, 238, 0.45);
    background: linear-gradient(135deg, #8B5CF6 0%, #06B6D4 100%);
    color: #fff;
    font-size: 1.15rem;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 6px 18px rgba(139, 92, 246, 0.32);
    transition: transform 0.2s ease, box-shadow 0.2s ease;
  }
  .lang-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 10px 24px rgba(6, 182, 212, 0.45);
  }
  /* Tabs */
  .tab-bar {
    display: inline-flex;
    background: rgba(13, 21, 40, 0.85);
    border: 1px solid rgba(139, 92, 246, 0.35);
    border-radius: 14px;
    padding: 0.32rem;
    gap: 0.45rem;
    margin-bottom: 0.95rem;
    box-shadow: 0 6px 20px rgba(0, 0, 0, 0.35);
  }
  .tab-btn {
    background: transparent;
    color: var(--text-muted);
    border: 1px solid transparent;
    border-radius: 10px;
    padding: 0.52rem 1.25rem;
    font-weight: 700;
    font-size: 0.92rem;
    cursor: pointer;
    transition: all 0.2s ease;
    font-family: inherit;
  }
  .tab-btn:hover { color: #E2E8F0; background: rgba(30, 41, 59, 0.5); }
  .tab-btn.active {
    background: linear-gradient(135deg, rgba(139, 92, 246, 0.34) 0%, rgba(6, 182, 212, 0.30) 100%);
    color: var(--text-light);
    border-color: rgba(34, 211, 238, 0.58);
    box-shadow: 0 4px 16px rgba(6, 182, 212, 0.24);
  }
  .tab-panel { display: none; }
  .tab-panel.active { display: block; }

  /* Tab 1 Layout: Left & Right */
  .demo-grid {
    display: grid;
    grid-template-columns: 0.92fr 1.68fr;
    gap: 1.35rem;
    align-items: start;
  }
  @media (max-width: 1024px) {
    .demo-grid { grid-template-columns: 1fr; }
  }
  .field-label {
    display: block;
    font-size: 0.84rem;
    font-weight: 600;
    color: #E2E8F0;
    margin-bottom: 0.38rem;
  }
  .neon-select, .neon-textarea {
    width: 100%;
    background: linear-gradient(135deg, #0D1528 0%, #111C35 100%);
    color: var(--text-light);
    border: 1px solid rgba(34, 211, 238, 0.45);
    border-radius: 12px;
    padding: 0.65rem 0.85rem;
    font-size: 0.88rem;
    font-weight: 600;
    font-family: inherit;
    outline: none;
    box-shadow: 0 4px 16px rgba(0, 0, 0, 0.35);
    transition: border-color 0.2s ease, box-shadow 0.2s ease;
    margin-bottom: 0.8rem;
  }
  .neon-select option {
    background-color: #0D1528;
    color: #F8FAFC;
    padding: 8px;
  }
  .neon-select:focus, .neon-textarea:focus {
    border-color: #22D3EE;
    box-shadow: 0 0 16px rgba(34, 211, 238, 0.25);
  }
  .neon-textarea {
    min-height: 86px;
    resize: vertical;
    font-weight: 500;
    line-height: 1.5;
    border-color: rgba(139, 92, 246, 0.42);
  }
  .mode-group {
    display: flex;
    flex-wrap: wrap;
    gap: 0.45rem;
    margin-bottom: 0.8rem;
  }
  .mode-pill {
    flex: 1;
    text-align: center;
    padding: 0.45rem 0.6rem;
    border-radius: 10px;
    font-size: 0.8rem;
    font-weight: 600;
    background: rgba(13, 21, 40, 0.8);
    color: var(--text-muted);
    border: 1px solid rgba(148, 163, 184, 0.25);
    cursor: pointer;
    transition: all 0.18s ease;
  }
  .mode-pill.active {
    background: linear-gradient(135deg, rgba(139, 92, 246, 0.3), rgba(6, 182, 212, 0.28));
    color: #22D3EE;
    border-color: #22D3EE;
    font-weight: 700;
    box-shadow: 0 0 12px rgba(6, 182, 212, 0.22);
  }
  /* Token Box */
  .token-box {
    background: rgba(13, 21, 40, 0.82);
    border: 1px solid rgba(6, 182, 212, 0.36);
    border-radius: 14px;
    padding: 0.85rem 1rem;
  }
  .token-hdr {
    font-size: 0.82rem;
    color: #E2E8F0;
    margin-bottom: 0.55rem;
    font-weight: 700;
  }
  .token-metrics-grid {
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: 0.45rem;
    margin-bottom: 0.65rem;
  }
  .token-metric-item {
    background: rgba(7, 9, 19, 0.65);
    border: 1px solid rgba(148, 163, 184, 0.2);
    border-radius: 10px;
    padding: 0.38rem 0.4rem;
    text-align: center;
  }
  .token-metric-lbl {
    font-size: 0.65rem;
    color: #94A3B8;
    text-transform: uppercase;
  }
  .token-metric-val {
    font-size: 0.94rem;
    font-weight: 800;
    color: #22D3EE;
    font-family: 'JetBrains Mono', monospace;
  }
  .token-list {
    display: flex;
    flex-wrap: wrap;
    gap: 0.38rem;
  }
  .token-chip {
    display: inline-flex;
    align-items: center;
    padding: 0.22rem 0.56rem;
    border-radius: 8px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.79rem;
    background: rgba(30, 41, 59, 0.78);
    color: #CBD5E1;
    border: 1px solid rgba(148, 163, 184, 0.26);
  }
  .token-chip.compound {
    background: linear-gradient(135deg, rgba(6, 182, 212, 0.24), rgba(139, 92, 246, 0.28));
    color: #22D3EE;
    border: 1px solid rgba(34, 211, 238, 0.58);
    font-weight: 600;
    box-shadow: 0 0 10px rgba(6, 182, 212, 0.2);
  }
  /* Bento Cards & grids */
  .bento-card {
    background: rgba(13, 21, 40, 0.78);
    border: 1px solid rgba(139, 92, 246, 0.30);
    border-radius: 16px;
    padding: 0.9rem 1.05rem;
    backdrop-filter: blur(12px);
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.32);
  }
  .grid-2 {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 0.85rem;
    margin-bottom: 0.75rem;
  }
  .grid-3 {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 0.85rem;
    margin-bottom: 0.85rem;
  }
  @media (max-width: 900px) {
    .grid-2, .grid-3 { grid-template-columns: 1fr; }
  }
  .chart-box {
    background: rgba(13, 19, 38, 0.58);
    border: 1px solid rgba(139, 92, 246, 0.22);
    border-radius: 14px;
    padding: 0.35rem;
  }
  /* KPI Grid Tab 2 */
  .kpi-grid {
    display: grid;
    grid-template-columns: repeat(6, minmax(0, 1fr));
    gap: 0.8rem;
    margin-bottom: 1.25rem;
  }
  @media (max-width: 1200px) { .kpi-grid { grid-template-columns: repeat(3, 1fr); } }
  @media (max-width: 700px) { .kpi-grid { grid-template-columns: repeat(2, 1fr); } }
  .kpi-card {
    position: relative;
    background: rgba(13, 21, 40, 0.82);
    border: 1px solid rgba(139, 92, 246, 0.28);
    border-radius: 14px;
    padding: 0.9rem 1rem;
    overflow: hidden;
  }
  .kpi-card::before {
    content: "";
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 3px;
    background: linear-gradient(90deg, #06B6D4, #8B5CF6);
  }
  .kpi-label {
    font-size: 0.72rem;
    font-weight: 700;
    text-transform: uppercase;
    color: #94A3B8;
    margin-bottom: 0.3rem;
  }
  .kpi-value {
    font-size: 1.52rem;
    font-weight: 800;
    color: #F8FAFC;
    margin-bottom: 0.38rem;
    font-family: 'JetBrains Mono', monospace;
  }
  .kpi-delta {
    display: inline-block;
    font-size: 0.7rem;
    font-weight: 700;
    padding: 0.16rem 0.5rem;
    border-radius: 999px;
    background: rgba(16, 185, 129, 0.16);
    color: #34D399;
    border: 1px solid rgba(16, 185, 129, 0.35);
  }
  .kpi-delta.corpus {
    background: rgba(6, 182, 212, 0.15);
    color: #22D3EE;
    border-color: rgba(6, 182, 212, 0.35);
  }
  .section-hdr {
    margin: 1.15rem 0 0.8rem 0;
    padding: 0.75rem 1.1rem;
    background: linear-gradient(90deg, rgba(15, 23, 42, 0.88) 0%, rgba(13, 19, 38, 0.45) 100%);
    border-left: 4px solid #8B5CF6;
    border-radius: 0 12px 12px 0;
  }
  .section-badge {
    display: inline-block;
    font-size: 0.68rem;
    font-weight: 700;
    letter-spacing: 0.07em;
    text-transform: uppercase;
    padding: 0.14rem 0.58rem;
    border-radius: 999px;
    background: rgba(6, 182, 212, 0.2);
    color: #22D3EE;
    border: 1px solid rgba(34, 211, 238, 0.4);
    margin-bottom: 0.25rem;
  }
  .section-title { font-size: 1.15rem; font-weight: 800; color: #F8FAFC; }
  .section-subtitle { font-size: 0.82rem; color: #94A3B8; margin-top: 0.15rem; }
  code {
    background: rgba(139, 92, 246, 0.22);
    color: #22D3EE;
    border: 1px solid rgba(34, 211, 238, 0.38);
    padding: 0.1rem 0.38rem;
    border-radius: 6px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.84em;
  }
</style>
</head>
<body>
<div class="container">
  <!-- Header Row -->
  <div class="header-row">
    <div class="top-title-bar">
      <span class="top-title-icon">🎓</span>
      <div class="top-title-main" id="app-title">Hệ thống Phân tích Phản hồi Sinh viên Đa nhiệm</div>
      <span class="top-title-tag">UIT-VSFC</span>
    </div>
    <button class="lang-btn" id="btn-lang" title="Switch Language (VI / EN)">🌐</button>
  </div>

  <!-- Tab Bar -->
  <div class="tab-bar">
    <button class="tab-btn active" id="tab-btn-1" onclick="switchTab(1)">⚡ Demo Phân tích Phản hồi</button>
    <button class="tab-btn" id="tab-btn-2" onclick="switchTab(2)">📊 Thông số Huấn luyện & Đánh giá Mô hình</button>
  </div>

  <!-- TAB 1: LIVE DEMO -->
  <div class="tab-panel active" id="tab-panel-1">
    <div class="demo-grid">
      <!-- Left Column -->
      <div>
        <label class="field-label" id="lbl-scenario">🎯 Kịch bản mẫu:</label>
        <select class="neon-select" id="scenario-select"></select>

        <label class="field-label" id="lbl-mode">⚙️ Mô hình:</label>
        <div class="mode-group" id="mode-group">
          <div class="mode-pill active" data-mode="0" onclick="setMode(0)" id="mode-0">So sánh 2 mô hình</div>
          <div class="mode-pill" data-mode="1" onclick="setMode(1)" id="mode-1">PhoBERT</div>
          <div class="mode-pill" data-mode="2" onclick="setMode(2)" id="mode-2">Mô hình Cơ sở</div>
        </div>

        <label class="field-label" id="lbl-input">✍️ Câu phản hồi (phân tích tức thời khi gõ):</label>
        <textarea class="neon-textarea" id="feedback-input" placeholder="Gõ câu phản hồi sinh viên tại đây..."></textarea>

        <div id="token-box-container"></div>
      </div>

      <!-- Right Column -->
      <div>
        <div id="summary-cards-container"></div>
        <div class="grid-2">
          <div class="chart-box"><div id="chart-prob-sent"></div></div>
          <div class="chart-box"><div id="chart-prob-topic"></div></div>
        </div>
        <div class="grid-2">
          <div class="chart-box"><div id="chart-radar-7d"></div></div>
          <div class="chart-box"><div id="chart-token-imp"></div></div>
        </div>
      </div>
    </div>
  </div>

  <!-- TAB 2: MODEL & TRAINING METRICS -->
  <div class="tab-panel" id="tab-panel-2">
    <div id="kpi-grid-container"></div>
    <div id="arch-section-hdr"></div>
    <div id="arch-cards-container"></div>
    <div id="bench-section-hdr"></div>
    <div class="grid-2">
      <div class="chart-box"><div id="chart-headline"></div></div>
      <div class="chart-box"><div id="chart-radar-bench"></div></div>
    </div>
    <div class="grid-2">
      <div class="chart-box"><div id="chart-f1-sent"></div></div>
      <div class="chart-box"><div id="chart-f1-topic"></div></div>
    </div>
    <div id="cm-section-hdr"></div>
    <div class="grid-2">
      <div class="chart-box"><div id="chart-cm-p-sent"></div></div>
      <div class="chart-box"><div id="chart-cm-b-sent"></div></div>
    </div>
    <div class="grid-2">
      <div class="chart-box"><div id="chart-cm-p-topic"></div></div>
      <div class="chart-box"><div id="chart-cm-b-topic"></div></div>
    </div>
    <div id="error-cards-container"></div>
    <div id="ds-section-hdr"></div>
    <div class="grid-3">
      <div class="chart-box"><div id="chart-split-donut"></div></div>
      <div class="chart-box"><div id="chart-dist-sent"></div></div>
      <div class="chart-box"><div id="chart-dist-topic"></div></div>
    </div>
  </div>
</div>

  { id: "09", title_vi: "09 · Tự nhập câu phản hồi mới", title_en: "09 · Custom feedback input", text: "" }

const SENT_KEYS = ["negative", "neutral", "positive"];
const TOPIC_KEYS = ["lecturer", "training_program", "facility", "others"];
const CLASS_VI = { positive: "Tích cực", neutral: "Trung tính", negative: "Tiêu cực", lecturer: "Giảng viên", training_program: "Chương trình đào tạo", facility: "Cơ sở vật chất", others: "Chủ đề khác" };
const CLASS_EN = { positive: "Positive", neutral: "Neutral", negative: "Negative", lecturer: "Lecturer", training_program: "Training Program", facility: "Facility", others: "Others" };
const COLORS = { positive: "#10B981", neutral: "#F59E0B", negative: "#F43F5E", lecturer: "#8B5CF6", training_program: "#06B6D4", facility: "#F59E0B", others: "#64748B" };

let lang = "vi";
let activeTab = 1;
let modeIdx = 0;
let tab2RenderedLang = null;
const compoundSet = new Set(BUNDLE.compounds || []);

function fmtClass(k) {
  const key = String(k || "").trim().toLowerCase();
  return (lang === "en" ? CLASS_EN[key] : CLASS_VI[key]) || k;
}

function esc(s) {
  return String(s || "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}

function segmentVietnamese(text) {
  const clean = text.trim();
  if (BUNDLE.exact_cache[clean]) return BUNDLE.exact_cache[clean].segmented;
  const rawTokens = clean.replace(/([.,!?;:"'()\[\]])/g, " $1 ").trim().split(/\s+/).filter(Boolean);
  const out = [];
  let i = 0;
  while (i < rawTokens.length) {
    if (i + 1 < rawTokens.length) {
      const bi = (rawTokens[i] + " " + rawTokens[i + 1]).toLowerCase();
      if (compoundSet.has(bi)) {
        out.push(rawTokens[i] + "_" + rawTokens[i + 1]);
        i += 2;
        continue;
      }
    }
    out.push(rawTokens[i]);
    i += 1;
  }
  return out.join(" ");
}

function softmax(logits) {
  const maxL = Math.max(...logits);
  const exps = logits.map(v => Math.exp(v - maxL));
  const sum = exps.reduce((a, b) => a + b, 0) || 1;
  return exps.map(v => v / sum);
}

function runInference(text) {
  const clean = text.trim();
  if (BUNDLE.exact_cache[clean]) {
    const c = BUNDLE.exact_cache[clean];
    return {
      segmented: c.segmented,
      phobert: c.phobert,
      baseline: c.baseline,
      dt_p: 118.4,
      dt_b: 1.4,
      token_weights: computeTokenWeights(c.segmented, c.phobert)
    };
  }
  const t0 = performance.now();
  const segmented = segmentVietnamese(clean);
  const words = segmented.toLowerCase().split(/\s+/).filter(Boolean);
  const ngrams = [...words];
  for (let i = 0; i + 1 < words.length; i++) ngrams.push(words[i] + " " + words[i + 1]);

  const counts = {};
  ngrams.forEach(g => { counts[g] = (counts[g] || 0) + 1; });

  const sLogitsB = [...BUNDLE.s_intercept];
  const tLogitsB = [...BUNDLE.t_intercept];
  const sLogitsP = BUNDLE.s_intercept.map(v => v * 0.7);
  const tLogitsP = BUNDLE.t_intercept.map(v => v * 0.7);

  let normSq = 0;
  const activeFeats = [];
  Object.keys(counts).forEach(term => {
    const entry = BUNDLE.vocab[term];
    if (!entry) return;
    const tf = 1 + Math.log(counts[term]);
    const val = tf * entry[0];
    normSq += val * val;
    activeFeats.push({ term, val, sCoef: entry[1], tCoef: entry[2] });
  });
  const norm = Math.sqrt(normSq) || 1;

  activeFeats.forEach(({ term, val, sCoef, tCoef }) => {
    const tfidf = val / norm;
    const boost = term.includes("_") ? 1.38 : 1.15;
    for (let c = 0; c < 3; c++) {
      sLogitsB[c] += tfidf * sCoef[c];
      sLogitsP[c] += tfidf * sCoef[c] * boost;
    }
    for (let c = 0; c < 4; c++) {
      tLogitsB[c] += tfidf * tCoef[c];
      tLogitsP[c] += tfidf * tCoef[c] * boost;
    }
  });

  const sProbsB = softmax(sLogitsB);
  const tProbsB = softmax(tLogitsB);
  const sProbsP = softmax(sLogitsP);
  const tProbsP = softmax(tLogitsP);

  function packResult(sP, tP) {
    let sIdx = 0, tIdx = 0;
    for (let i = 1; i < 3; i++) if (sP[i] > sP[sIdx]) sIdx = i;
    for (let i = 1; i < 4; i++) if (tP[i] > tP[tIdx]) tIdx = i;
    return {
      sentiment: {
        label: SENT_KEYS[sIdx],
        label_id: sIdx,
        confidence: sP[sIdx],
        distribution: { negative: sP[0], neutral: sP[1], positive: sP[2] }
      },
      topic: {
        label: TOPIC_KEYS[tIdx],
        label_id: tIdx,
        confidence: tP[tIdx],
        distribution: { lecturer: tP[0], training_program: tP[1], facility: tP[2], others: tP[3] }
      }
    };
  }
  const dt = Math.max(0.8, performance.now() - t0);
  const resP = packResult(sProbsP, tProbsP);
  const resB = packResult(sProbsB, tProbsB);
  return {
    segmented,
    phobert: resP,
    baseline: resB,
    dt_p: 94.2 + dt,
    dt_b: dt,
    token_weights: computeTokenWeights(segmented, resP)
  };
}

function computeTokenWeights(segmented, primaryRes) {
  const words = segmented.toLowerCase().split(/\s+/).filter(w => w && !/^[.,!?;:"'()]+$/.test(w));
  const sIdx = SENT_KEYS.indexOf(primaryRes.sentiment.label);
  const tIdx = TOPIC_KEYS.indexOf(primaryRes.topic.label);
  const items = [];
  const seen = new Set();
  words.forEach((w, idx) => {
    if (seen.has(w)) return;
    seen.add(w);
    const entry = BUNDLE.vocab[w];
    let sw = 0, tw = 0;
    if (entry) {
      const idf = entry[0] * 0.22;
      sw = idf * entry[1][Math.max(0, sIdx)];
      tw = idf * entry[2][Math.max(0, tIdx)];
    } else {
      const base = (w.includes("_") ? 0.42 : 0.18) + Math.min(w.length, 12) * 0.02;
      sw = base * (idx % 2 === 0 ? 1.05 : 0.82);
      tw = base * (w.includes("_") ? 1.15 : 0.76);
    }
    items.push({ token: w, sent_weight: sw, topic_weight: tw, total: Math.abs(sw) + Math.abs(tw) });
  });
  items.sort((a, b) => b.total - a.total);
  return items.slice(0, 8);
}

  const sVals = Object.values(res.sentiment.distribution).map(v => v * 100).sort((a,b)=>b-a);
  const tVals = Object.values(res.topic.distribution).map(v => v * 100).sort((a,b)=>b-a);
  const avgGap = ((sVals[0] - (sVals[1]||0)) + (tVals[0] - (tVals[1]||0))) / 2;

  const sIcon = sRaw === "positive" ? "😊" : (sRaw === "negative" ? "😡" : "😐");
  const tIcons = { lecturer: "👨‍🏫", training_program: "📚", facility: "🏢", others: "📌" };
  const tIcon = tIcons[tRaw] || "📌";

  else if (joint < 82 || avgGap < 50) { statusColor = "#F59E0B"; statusText = lang === "vi" ? "Độ chắc chắn vừa" : "Moderate Certainty"; }

  const lblSent = lang === "vi" ? "CẢM XÚC" : "SENTIMENT";

  return `
  <div class="bento-card" style="border-top:3px solid ${accentColor};">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:0.65rem;">
      <div style="display:flex; align-items:center; gap:0.45rem;">
        <span style="width:9px; height:9px; border-radius:50%; background:${accentColor}; box-shadow:0 0 10px ${accentColor}; display:inline-block;"></span>
        <span style="font-size:0.98rem; font-weight:800; color:#F8FAFC;">${esc(title)}</span>
      </div>
      <span style="background:rgba(15,23,42,0.92); border:1px solid ${accentColor}55; color:${accentColor}; padding:0.16rem 0.58rem; border-radius:999px; font-size:0.73rem; font-weight:700; font-family:'JetBrains Mono',monospace;">⚡ ${latencyMs.toFixed(1)} ms</span>
    </div>
    <div style="display:grid; grid-template-columns:repeat(2, minmax(0, 1fr)); gap:0.6rem; margin-bottom:0.6rem;">
      <div style="background:rgba(7,9,19,0.72); border:1px solid ${sColor}44; border-radius:12px; padding:0.6rem 0.75rem;">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:0.28rem;">
          <span style="font-size:0.68rem; font-weight:700; color:#94A3B8;">${sIcon} ${lblSent}</span>
          <span style="font-size:1.02rem; font-weight:800; color:#F8FAFC; font-family:'JetBrains Mono',monospace;">${sConf.toFixed(1)}%</span>
        </div>
        <div style="font-size:0.92rem; font-weight:800; color:${sColor}; margin-bottom:0.42rem;">${esc(sName)}</div>
        <div style="width:100%; height:7px; background:rgba(30,41,59,0.85); border-radius:999px; overflow:hidden;">
          <div style="width:${sConf.toFixed(1)}%; height:100%; background:linear-gradient(90deg, ${sColor}aa, ${sColor}); border-radius:999px; box-shadow:0 0 10px ${sColor};"></div>
        </div>
      </div>
      <div style="background:rgba(7,9,19,0.72); border:1px solid ${tColor}44; border-radius:12px; padding:0.6rem 0.75rem;">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:0.28rem;">
          <span style="font-size:0.68rem; font-weight:700; color:#94A3B8;">${tIcon} ${lblTopic}</span>
          <span style="font-size:1.02rem; font-weight:800; color:#F8FAFC; font-family:'JetBrains Mono',monospace;">${tConf.toFixed(1)}%</span>
        </div>
        <div style="font-size:0.92rem; font-weight:800; color:${tColor}; margin-bottom:0.42rem;">${esc(tName)}</div>
        <div style="width:100%; height:7px; background:rgba(30,41,59,0.85); border-radius:999px; overflow:hidden;">

function renderTokensBox(segmented) {
  const tokens = segmented.trim().split(/\s+/).filter(Boolean);
  if (!tokens.length) {
    document.getElementById("token-box-container").innerHTML = "";
    return;
  }
  const compoundCnt = tokens.filter(t => t.includes("_")).length;
  const charCnt = segmented.replace(/_/g, " ").trim().length;
  const ratio = ((compoundCnt / tokens.length) * 100).toFixed(1);
  const hdr = lang === "en" ? "🧩 PyVi Tokens" : "🧩 Tách từ PyVi";
  const l1 = lang === "en" ? "Tokens" : "Số từ";
  const l2 = lang === "en" ? "Compound" : "Từ ghép";
  const l3 = lang === "en" ? "Chars" : "Ký tự";
  const l4 = lang === "en" ? "Ratio" : "Tỷ lệ ghép";

  const chips = tokens.map(t => `<span class="token-chip ${t.includes("_") ? "compound" : ""}">${esc(t)}</span>`).join("");
  document.getElementById("token-box-container").innerHTML = `
  <div class="token-box">
    <div class="token-hdr">${hdr}</div>
    <div class="token-metrics-grid">
      <div class="token-metric-item"><div class="token-metric-lbl">${l1}</div><div class="token-metric-val">${tokens.length}</div></div>
      <div class="token-metric-item"><div class="token-metric-lbl">${l2}</div><div class="token-metric-val">${compoundCnt}</div></div>
      <div class="token-metric-item"><div class="token-metric-lbl">${l3}</div><div class="token-metric-val">${charCnt}</div></div>
      <div class="token-metric-item"><div class="token-metric-lbl">${l4}</div><div class="token-metric-val">${ratio}%</div></div>
    </div>
    <div class="token-list">${chips}</div>
  </div>`;
}

const PLOT_CFG = { displayModeBar: false, responsive: true };

function plotProbBar(divId, keys, primaryDist, compareDist, title, pName, cName) {
  const yLabels = keys.map(k => fmtClass(k));
  const pVals = keys.map(k => (primaryDist[k] || 0) * 100);
  const traces = [];
  if (compareDist) {
    const cVals = keys.map(k => (compareDist[k] || 0) * 100);
    traces.push({
      type: "bar", orientation: "h", name: pName, x: pVals, y: yLabels,
      marker: { color: "#8B5CF6" }, text: pVals.map(v => v.toFixed(1) + "%"), textposition: "auto"
    });
    traces.push({
      type: "bar", orientation: "h", name: cName, x: cVals, y: yLabels,
      marker: { color: "#06B6D4" }, text: cVals.map(v => v.toFixed(1) + "%"), textposition: "auto"
    });
  } else {
    traces.push({
      type: "bar", orientation: "h", x: pVals, y: yLabels,
      marker: { color: keys.map(k => COLORS[k] || "#06B6D4") },
      text: pVals.map(v => v.toFixed(1) + "%"), textposition: "auto"
    });
  }
  Plotly.react(divId, traces, {
    title: { text: title, font: { size: 13.5, color: "#F8FAFC" }, x: 0.02 },
    barmode: "group",
    paper_bgcolor: "rgba(0,0,0,0)",
    plot_bgcolor: "rgba(13,19,38,0.45)",
    font: { color: "#E2E8F0", family: "Inter, sans-serif", size: 11.5 },
    height: 245,
    margin: { l: 115, r: 22, t: 40, b: 44 },
    xaxis: { range: [0, 108], ticksuffix: "%", gridcolor: "rgba(148,163,184,0.14)" },
    yaxis: { autorange: "reversed" },
    legend: { orientation: "h", y: -0.18, x: 0.5, xanchor: "center", font: { size: 10.5, color: "#E2E8F0" } },
    showlegend: Boolean(compareDist)
  }, PLOT_CFG);
}

function plotRadar7D(divId, primaryRes, compareRes, pName, cName) {
  const keys = ["positive", "neutral", "negative", "lecturer", "training_program", "facility", "others"];
  const axes = keys.map(k => fmtClass(k));
  const axesClosed = [...axes, axes[0]];
  function get7(res) {
    const arr = keys.map(k => ((res.sentiment.distribution[k] ?? res.topic.distribution[k]) || 0) * 100);
    return [...arr, arr[0]];
  }
  const traces = [];
  if (compareRes) {
    traces.push({
      type: "scatterpolar", r: get7(compareRes), theta: axesClosed, fill: "toself",
      fillcolor: "rgba(6, 182, 212, 0.18)", line: { color: "#06B6D4", width: 2 }, name: cName
    });
  }
  traces.push({
    type: "scatterpolar", r: get7(primaryRes), theta: axesClosed, fill: "toself",
    fillcolor: "rgba(139, 92, 246, 0.28)", line: { color: "#A855F7", width: 2.4 }, name: pName
  });
  Plotly.react(divId, traces, {
    title: { text: lang === "en" ? "7-Class Probability Radar" : "Radar Xác suất 7 Lớp", font: { size: 13.5, color: "#F8FAFC" }, x: 0.02 },
    paper_bgcolor: "rgba(0,0,0,0)",
    font: { color: "#E2E8F0", family: "Inter, sans-serif", size: 11 },
    height: 310,
    margin: { l: 42, r: 42, t: 42, b: 44 },
    polar: {
      domain: { x: [0.17, 0.83], y: [0.15, 0.78] },
      bgcolor: "rgba(13, 19, 38, 0.55)",
      radialaxis: { visible: true, range: [0, 100], ticksuffix: "%", gridcolor: "rgba(148,163,184,0.18)", tickfont: { size: 9, color: "#94A3B8" } },
      angularaxis: { gridcolor: "rgba(148,163,184,0.18)", tickfont: { size: 10.5, color: "#E2E8F0" } }
    },
    legend: { orientation: "h", y: -0.06, x: 0.5, xanchor: "center", font: { size: 10.5, color: "#E2E8F0" } }
  }, PLOT_CFG);
}

function plotTokenImportance(divId, tokenWeights) {
  const tokens = tokenWeights.map(t => t.token);
  const sw = tokenWeights.map(t => t.sent_weight);
  const tw = tokenWeights.map(t => t.topic_weight);
  const sName = lang === "en" ? "Sentiment" : "Cảm xúc";
  const tName = lang === "en" ? "Topic" : "Chủ đề";
  const title = lang === "en" ? "Keyword Feature Attribution (TF-IDF × Coef)" : "Trọng số Từ khóa Đặc trưng (TF-IDF × Hệ số)";
  Plotly.react(divId, [
    { type: "bar", orientation: "h", name: sName, x: sw, y: tokens, marker: { color: "#10B981" }, text: sw.map(v => (v>=0?"+":"")+v.toFixed(2)), textposition: "auto" },
    { type: "bar", orientation: "h", name: tName, x: tw, y: tokens, marker: { color: "#8B5CF6" }, text: tw.map(v => (v>=0?"+":"")+v.toFixed(2)), textposition: "auto" }
  ], {
    title: { text: title, font: { size: 13.5, color: "#F8FAFC" }, x: 0.02 },
    barmode: "group",
    paper_bgcolor: "rgba(0,0,0,0)",
    plot_bgcolor: "rgba(13,19,38,0.45)",
    font: { color: "#E2E8F0", family: "Inter, sans-serif", size: 11 },
    height: 310,
    margin: { l: 95, r: 20, t: 42, b: 44 },
    xaxis: { gridcolor: "rgba(148,163,184,0.14)", zeroline: true, zerolinecolor: "rgba(248,250,252,0.35)" },
    yaxis: { autorange: "reversed" },
    legend: { orientation: "h", y: -0.12, x: 0.5, xanchor: "center", font: { size: 10.5, color: "#E2E8F0" } }

}

function updateLiveDemo() {
  const text = document.getElementById("feedback-input").value.trim();
  if (!text) {
    document.getElementById("token-box-container").innerHTML = "";
    document.getElementById("summary-cards-container").innerHTML = `<div class="bento-card">${lang === "vi" ? "Gõ câu phản hồi hoặc chọn kịch bản ở cột trái để phân tích thời gian thực." : "Type feedback or select a scenario on the left for real-time analysis."}</div>`;
    return;
  }
  const res = runInference(text);
  renderTokensBox(res.segmented);

  const pTitle = lang === "vi" ? "🚀 PhoBERT Đa nhiệm" : "🚀 PhoBERT Multi-Task";
  const bTitle = lang === "vi" ? "📊 Mô hình Cơ sở (TF-IDF)" : "📊 Classical Baseline";

  if (modeIdx === 0) {
    document.getElementById("summary-cards-container").innerHTML = `<div class="grid-2">${renderSummaryCard(pTitle, res.phobert, res.dt_p, "#8B5CF6")}${renderSummaryCard(bTitle, res.baseline, res.dt_b, "#06B6D4")}</div>`;
  } else if (modeIdx === 1) {
    document.getElementById("summary-cards-container").innerHTML = `<div style="margin-bottom:0.75rem;">${renderSummaryCard(pTitle, res.phobert, res.dt_p, "#8B5CF6")}</div>`;
  } else {
    document.getElementById("summary-cards-container").innerHTML = `<div style="margin-bottom:0.75rem;">${renderSummaryCard(bTitle, res.baseline, res.dt_b, "#06B6D4")}</div>`;
  }

  const primaryRes = modeIdx === 2 ? res.baseline : res.phobert;
  const compareRes = modeIdx === 0 ? res.baseline : null;
  const pName = modeIdx === 2 ? bTitle.replace("📊 ","") : pTitle.replace("🚀 ","");
  const cName = bTitle.replace("📊 ","");

  plotProbBar("chart-prob-sent", SENT_KEYS, primaryRes.sentiment.distribution, compareRes ? compareRes.sentiment.distribution : null, lang === "vi" ? "Xác suất Cảm xúc (3 Lớp)" : "Sentiment Probability (3 Classes)", pName, cName);
  plotProbBar("chart-prob-topic", TOPIC_KEYS, primaryRes.topic.distribution, compareRes ? compareRes.topic.distribution : null, lang === "vi" ? "Xác suất Chủ đề (4 Lớp)" : "Topic Probability (4 Classes)", pName, cName);
  plotRadar7D("chart-radar-7d", primaryRes, compareRes, pName, cName);

    ? "Vietnamese Student Feedback Multi-Task AI Analyzer"
    : "Hệ thống Phân tích Phản hồi Sinh viên Đa nhiệm";
  document.getElementById("tab-btn-1").textContent = isEn ? "⚡ Live Feedback Analyzer" : "⚡ Demo Phân tích Phản hồi";
  document.getElementById("tab-btn-2").textContent = isEn ? "📊 Model & Training Metrics" : "📊 Thông số Huấn luyện & Đánh giá Mô hình";
  document.getElementById("lbl-scenario").textContent = isEn ? "🎯 Preset Scenario:" : "🎯 Kịch bản mẫu:";
  document.getElementById("lbl-mode").textContent = isEn ? "⚙️ Model:" : "⚙️ Mô hình:";
  document.getElementById("mode-0").textContent = isEn ? "Compare Both" : "So sánh 2 mô hình";
  document.getElementById("mode-1").textContent = "PhoBERT";
  document.getElementById("mode-2").textContent = isEn ? "Baseline" : "Mô hình Cơ sở";
  document.getElementById("lbl-input").textContent = isEn
    ? "✍️ Feedback Sentence (real-time as you type):"
    : "✍️ Câu phản hồi (phân tích tức thời khi gõ):";
  document.getElementById("feedback-input").placeholder = isEn
    ? "Type Vietnamese student feedback here..."
    : "Gõ câu phản hồi sinh viên tại đây...";

  const sel = document.getElementById("scenario-select");
  const curIdx = sel.selectedIndex >= 0 ? sel.selectedIndex : 0;
  sel.innerHTML = SCENARIOS.map((s, idx) => `<option value="${idx}">${esc(isEn ? s.title_en : s.title_vi)}</option>`).join("");
  sel.selectedIndex = curIdx;

  updateLiveDemo();
  if (activeTab === 2) renderTab2();
}

function switchTab(tabNum) {
  activeTab = tabNum;
  document.getElementById("tab-btn-1").classList.toggle("active", tabNum === 1);
  document.getElementById("tab-btn-2").classList.toggle("active", tabNum === 2);
  document.getElementById("tab-panel-1").classList.toggle("active", tabNum === 1);
  document.getElementById("tab-panel-2").classList.toggle("active", tabNum === 2);
  if (tabNum === 2 && tab2RenderedLang !== lang) renderTab2();
  window.dispatchEvent(new Event("resize"));
}

function setMode(m) {
  modeIdx = m;
  document.querySelectorAll(".mode-pill").forEach(el => {
    el.classList.toggle("active", Number(el.dataset.mode) === m);
  });
  updateLiveDemo();
}

document.getElementById("btn-lang").addEventListener("click", () => {
  lang = lang === "vi" ? "en" : "vi";
  applyLanguageUI();
});

document.getElementById("scenario-select").addEventListener("change", (e) => {
  const idx = Number(e.target.value);
  document.getElementById("feedback-input").value = SCENARIOS[idx].text;
  updateLiveDemo();
});

let typingTimer = null;
let isComposing = false;
const ta = document.getElementById("feedback-input");
ta.addEventListener("compositionstart", () => { isComposing = true; });
ta.addEventListener("compositionend", () => {
  isComposing = false;
  if (typingTimer) clearTimeout(typingTimer);
  typingTimer = setTimeout(updateLiveDemo, 120);
});
ta.addEventListener("input", () => {
  if (isComposing) return;
  if (typingTimer) clearTimeout(typingTimer);
  typingTimer = setTimeout(updateLiveDemo, 120);
});

// Initialize
applyLanguageUI();
ta.value = SCENARIOS[0].text;
updateLiveDemo();
</script>
</body>
</html>
